# ============================================================================
#  Dictionnaire de recherche du Centre de Ressources Danfoss
# ============================================================================
#  Ce fichier n'ajoute AUCUN document : il ajoute du VOCABULAIRE (themes,
#  termes metier, alarmes) et le relie aux documents deja presents dans
#  data/catalog.yaml. Il est compile dans la page au build (Hugo) puis indexe
#  en memoire au chargement -> aucune requete reseau, aucune base de donnees.
#
#  4 sections :
#    products  : noms/alias de gammes et codes produits -> categorie du catalogue
#    synonyms  : groupes de mots equivalents (expansion de la requete)
#    topics    : themes techniques -> documents cibles (regles "scope")
#    alarms    : codes d'alarmes / defauts -> document qui les documente
#
#  Regles de "scope" (toutes les cles presentes doivent correspondre) :
#    family: id de gamme (ic7, ic2, vlt, demarreurs, options, outils)
#    cat:    nom de categorie (sous-chaine, ex. "FC-302")
#    group:  nom de groupe    (sous-chaine, ex. "Communication")
#    type:   type de document (guide, manual, datasheet, brochure, drawings, list, software)
#    name:   nom du document  (sous-chaine, ex. "programmation")
#    not:    exclusion (sous-chaine testee sur nom + groupe + categorie)
#
#  Les libelles d'alarmes/evenements de la section 4 sont RELEVES DANS LES
#  GUIDES OFFICIELS Danfoss (chapitre indique par `section` de chaque groupe) :
#  guides de programmation FC-102/202/302, guides d'application iC2 et iC7,
#  manuel d'utilisation MCD 600. Le libelle FR des VLT et de l'iC2 est le texte
#  affiche sur le panneau de commande (abrege) ; `terms` ajoute les mots
#  complets utiles a la recherche.
#  Le PDF reste la reference pour la cause exacte et la procedure a appliquer.
# ============================================================================

version: 1

# ---------------------------------------------------------------------------
# 1. Produits & gammes : ce que l'utilisateur tape -> categorie du catalogue
#    (un terme peut etre un debut de code produit colle depuis un devis)
# ---------------------------------------------------------------------------
products:
  # gammes entieres (family) : utile quand l'utilisateur ne precise pas l'application
  - family: ic7
    terms: ["ic7", "ic-7", "ic 7", "serie ic7", "series ic7"]
  - family: vlt
    terms: ["vlt", "fc-30", "fc-20", "fc-10", "serie fc"]
  - family: demarreurs
    terms: ["mcd", "demarreur progressif", "soft starter", "softstarter"]
  # categories precises
  - cat: "FC-302"
    terms: ["fc-302", "fc302", "fc 302", "fc-301", "fc301", "automationdrive", "automation drive", "vlt automation"]
  - cat: "FC-202"
    terms: ["fc-202", "fc202", "fc 202", "aquadrive", "aqua drive", "vlt aqua"]
  - cat: "FC-102"
    terms: ["fc-102", "fc102", "fc 102", "hvacdrive", "hvac drive", "vlt hvac"]
  - cat: "iC7 Automation"
    terms: ["ic7 automation", "ic7-automation", "ic7 auto", "ic7-30", "ic7-60", "ic7-mp"]
  - cat: "iC-7 AQUA"
    terms: ["ic7 aqua", "ic-7 aqua", "ic7aqua", "ic7-aqua"]
  - cat: "iC7-HVACR"
    terms: ["ic7 hvac", "ic7-hvac", "ic7 hvacr", "ic7-hvacr", "ic7 clim", "ic7 froid"]
  - cat: "iC2"
    terms: ["ic2", "ic-2", "ic2 micro", "ic2-30", "micro drive", "microdrive"]
  - cat: "MCD 600"
    terms: ["mcd 600", "mcd600", "mcd-600"]
  - cat: "MCD 200 (201/202)"
    terms: ["mcd 200", "mcd200", "mcd 201", "mcd201", "mcd 202", "mcd202"]
  - cat: "Options FC"
    terms: ["mca", "mcb", "option fc", "options fc", "carte option vlt"]
  - cat: "Options iC7"
    terms: ["oc7", "option ic7", "options ic7", "carte option ic7"]
  - cat: "Logiciels"
    terms: ["logiciel", "software", "telechargement", "download", "outil pc"]
  - cat: "Librairies"
    terms: ["librairie", "library", "bibliotheque", "gsd", "gsdml", "eds", "esi"]

