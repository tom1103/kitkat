  - ["cable", "cablage", "wiring", "raccordement", "borne", "terminal", "schema"]
  - ["dimensionnement", "sizing", "design", "selection", "choix", "calcul"]
  - ["manuel", "manual", "notice", "documentation", "guide", "handbook"]
  - ["securite", "safety", "safe"]
  - ["mise en service", "commissioning", "demarrage", "startup", "start-up", "quick start", "prise en main"]
