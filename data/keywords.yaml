# ============================================================================
#  Dictionnaire de recherche du Centre de Ressources Danfoss
# ============================================================================
#  Ce fichier n'ajoute AUCUN document : il ajoute du VOCABULAIRE (themes,
#  termes metier, alarmes) et le relie aux documents deja presents dans
#  data/catalog.yaml. Il est compile dans la page au build (Hugo) puis indexe
#  en memoire au chargement -> aucune requete reseau, aucune base de donnees.
#
#  4 sections :
#    products  : noms/alias de gammes et codes produits -> categorie du catalogue
#    synonyms  : groupes de mots equivalents (expansion de la requete)
#    topics    : themes techniques -> documents cibles (regles "scope")
#    alarms    : codes d'alarmes / defauts -> document qui les documente
#
#  Regles de "scope" (toutes les cles presentes doivent correspondre) :
#    family: id de gamme (ic7, ic2, vlt, demarreurs, options, outils)
#    cat:    nom de categorie (sous-chaine, ex. "FC-302")
#    group:  nom de groupe    (sous-chaine, ex. "Communication")
#    type:   type de document (guide, manual, datasheet, brochure, drawings, list, software)
#    name:   nom du document  (sous-chaine, ex. "programmation")
#    not:    exclusion (sous-chaine testee sur nom + groupe + categorie)
#
#  AVERTISSEMENT : les libelles d'alarmes ci-dessous sont une AIDE A LA
#  RECHERCHE (retrouver le bon PDF rapidement). Le document officiel Danfoss
#  reste la seule reference : verifier le libelle exact, la cause et la
#  procedure dans le guide de programmation de la gamme concernee.
# ============================================================================

version: 1

# ---------------------------------------------------------------------------
# 1. Produits & gammes : ce que l'utilisateur tape -> categorie du catalogue
#    (un terme peut etre un debut de code produit colle depuis un devis)
# ---------------------------------------------------------------------------
